<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDW Prospects: NYC-Metro AV Client Directory</title>
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #f0b429; --link: #58a6ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  h1 .gold { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 0.95rem; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  input { flex: 1; min-width: 220px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px 12px; font-size: 0.95rem; }
  input:focus { outline: none; border-color: var(--accent); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .filters button { background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 7px 14px; font-size: 0.85rem; cursor: pointer; }
  .filters button.active { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
  .filters button:hover { border-color: var(--accent); }
  #summary { color: var(--muted); font-size: 0.9rem; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .card:hover { border-color: var(--accent); }
  .card h3 { margin: 0; font-size: 1.05rem; }
  .badge { display: inline-block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 10px; width: fit-content; }
  .area { color: var(--muted); font-size: 0.85rem; }
  .fit { font-size: 0.9rem; line-height: 1.45; color: var(--text); }
  .links { margin-top: auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-top: 6px; }
  .links a { color: var(--link); text-decoration: none; font-size: 0.88rem; }
  .links a:hover { text-decoration: underline; }
  .phone { color: var(--muted); font-size: 0.85rem; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.8rem; border-top: 1px solid var(--border); padding-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="gold">IDW</span> Prospect Directory</h1>
  <p class="sub">NYC-metro venues, production companies, and agencies that buy AV services. Public info only.</p>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Search by name, area, or keyword…" autocomplete="off">
  </div>
  <div class="filters" id="filters"></div>
  <div id="summary"></div>
  <div class="grid" id="grid"></div>
  <footer>IDW Entertainment Technology, LLC. Directory of publicly listed businesses for outreach research.</footer>
</div>
<script>
const PROSPECTS = [
  // AV / event production companies
  { name: "BML-Blackbird", type: "Production Co.", area: "Secaucus, NJ", site: "https://bmlblackbird.com", phone: "201-617-8900", fit: "Theatrical and event production with deep rental inventory, staffs large crews for NY and NJ events." },
  { name: "WorldStage", type: "Production Co.", area: "Midtown Manhattan", site: "https://worldstage.com", phone: "212-582-2345", fit: "Corporate, theatrical, and artistic AV, regularly needs freelance audio, video, and lighting engineers." },
  { name: "PRG", type: "Production Co.", area: "Secaucus, NJ", site: "https://prg.com", phone: "", fit: "Global production provider with NJ operations, constant demand for freelance production crew." },
  { name: "4Wall Entertainment", type: "Production Co.", area: "New York metro", site: "https://4wall.com", phone: "", fit: "Lighting, audio, video, and rigging rentals plus production, uses freelance techs on shows." },
  { name: "AVP.Live", type: "Production Co.", area: "New Jersey", site: "https://avp.live", phone: "", fit: "Corporate town halls and product launches across NJ, NYC, and Philly, crew-run productions." },
  { name: "Summit AV", type: "Production Co.", area: "New Jersey", site: "https://summitavrental.com", phone: "", fit: "Full-service AV rental and event production for corporate events and conferences." },
  { name: "Hellhound Audio", type: "Production Co.", area: "New York metro", site: "https://hellhoundaudio.com", phone: "", fit: "Event audio, lighting, staging, and power production, boutique shop that scales with freelancers." },
  { name: "Mondo Media Solutions", type: "Production Co.", area: "New York, NY", site: "https://mmsproav.com", phone: "", fit: "Corporate AV production and integration with an event-heavy client base." },
  // Event agencies / DMCs
  { name: "Empire Force Events", type: "Event Agency", area: "New York, NY", site: "https://empireforceevents.com", phone: "", fit: "Independent NYC DMC producing full-scale corporate events, outsources technical production." },
  { name: "23 Layers", type: "Event Agency", area: "New York, NY", site: "https://23layers.com", phone: "", fit: "Event planning and production firm running high-end corporate and social events." },
  { name: "FIRST", type: "Event Agency", area: "New York, NY", site: "https://firstagency.com", phone: "", fit: "Corporate events agency delivering conferences and brand experiences, hires production partners." },
  { name: "PRA", type: "Event Agency", area: "New York, NY", site: "https://pra.com", phone: "", fit: "National DMC with NYC presence, designs conferences and incentives that need AV crews." },
  { name: "Event Solutions", type: "Event Agency", area: "New York, NY", site: "https://eventsolutions.com", phone: "", fit: "Full-service corporate event planning and DMC services, decades of productions." },
  { name: "Jack Morton", type: "Event Agency", area: "New York, NY", site: "https://jackmorton.com", phone: "", fit: "Global brand experience agency with NYC office, large-scale productions need freelance engineers." },
  { name: "Momentum Worldwide", type: "Event Agency", area: "New York, NY", site: "https://momentumww.com", phone: "", fit: "Experiential marketing agency producing brand activations and live events." },
  // Hotels / conference centers
  { name: "Javits Center", type: "Venue", area: "Hudson Yards, Manhattan", site: "https://javitscenter.com", phone: "", fit: "NYC's largest convention campus, outside AV vendors work its trade shows and launches." },
  { name: "Meadowlands Exposition Center", type: "Venue", area: "Secaucus, NJ", site: "https://mecexpo.com", phone: "", fit: "Major NJ expo facility hosting trade shows and corporate events." },
  { name: "Marriott Marquis", type: "Venue", area: "Times Square, Manhattan", site: "https://www.marriott.com", phone: "", fit: "Flagship Times Square hotel with huge meeting space, heavy corporate event volume." },
  { name: "Hilton New York Midtown", type: "Venue", area: "Midtown Manhattan", site: "https://www.hilton.com", phone: "", fit: "One of NYC's largest event hotels, constant conferences and galas." },
  // Performing arts venues
  { name: "NJPAC", type: "Venue", area: "Newark, NJ", site: "https://njpac.org", phone: "", fit: "New Jersey's premier performing arts center, concerts and rentals need production support." },
  { name: "Beacon Theatre", type: "Venue", area: "Upper West Side, Manhattan", site: "https://beacontheatre.com", phone: "", fit: "Historic concert venue with a packed calendar, touring and house productions." },
  { name: "Kings Theatre", type: "Venue", area: "Flatbush, Brooklyn", site: "https://kingstheatre.com", phone: "", fit: "Restored 3,000-seat Brooklyn venue hosting concerts and special events." },
  { name: "Mayo Performing Arts Center", type: "Venue", area: "Morristown, NJ", site: "https://mayoarts.org", phone: "", fit: "Busy NJ presenter with concerts year round, plus production and event rentals." },
  { name: "State Theatre New Jersey", type: "Venue", area: "New Brunswick, NJ", site: "https://stnj.org", phone: "", fit: "Major NJ roadhouse presenting concerts and shows, plus event rentals." },
  { name: "BAM", type: "Venue", area: "Fort Greene, Brooklyn", site: "https://bam.org", phone: "", fit: "Brooklyn Academy of Music, theater, dance, and music programming at scale." },
  { name: "Wellmont Theater", type: "Venue", area: "Montclair, NJ", site: "https://wellmonttheater.com", phone: "", fit: "Live Nation operated NJ theater with steady concert programming." },
  // Houses of worship
  { name: "Times Square Church", type: "House of Worship", area: "Midtown Manhattan", site: "https://tsc.nyc", phone: "+1 212-541-6300", fit: "Theater-scale worship production with broadcast and streaming, dedicated production director." },
  { name: "Brooklyn Tabernacle", type: "House of Worship", area: "Downtown Brooklyn", site: "https://brooklyntabernacle.org", phone: "", fit: "10,000-member church with world-famous choir, live streamed services twice weekly." },
  { name: "Christian Cultural Center", type: "House of Worship", area: "East New York, Brooklyn", site: "https://cccinfo.org", phone: "", fit: "One of NYC's largest congregations, major production operation." },
  { name: "Liquid Church", type: "House of Worship", area: "New Jersey, multi-campus", site: "https://liquidchurch.com", phone: "", fit: "Multi-campus NJ church with modern broadcast-style weekend production." },
  { name: "Redeemer Presbyterian", type: "House of Worship", area: "Manhattan", site: "https://redeemer.com", phone: "", fit: "Large Manhattan church with multiple services and production teams." },
  { name: "V1 Church", type: "House of Worship", area: "Manhattan, Brooklyn, Long Island, NJ", site: "https://v1church.com", phone: "", fit: "Fast-growing multi-site church with high-energy live production." }
];
const TYPES = ["All", "Production Co.", "Event Agency", "Venue", "House of Worship"];
let activeType = "All";

function counts() {
  const c = {};
  for (const p of PROSPECTS) c[p.type] = (c[p.type] || 0) + 1;
  return c;
}

function renderFilters() {
  const el = document.getElementById('filters');
  const c = counts();
  el.innerHTML = TYPES.map(t => {
    const label = t === "All" ? "All (" + PROSPECTS.length + ")" : t + " (" + (c[t] || 0) + ")";
    return '<button data-t="' + t + '" class="' + (t === activeType ? 'active' : '') + '">' + label + '</button>';
  }).join('');
  el.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    activeType = b.dataset.t;
    renderFilters();
    render(document.getElementById('q').value);
  }));
}

function card(p) {
  const phone = p.phone ? '<span class="phone">' + p.phone + '</span>' : '';
  return '<div class="card">' +
    '<span class="badge">' + p.type + '</span>' +
    '<h3>' + p.name + '</h3>' +
    '<div class="area">' + p.area + '</div>' +
    '<div class="fit">' + p.fit + '</div>' +
    '<div class="links"><a href="' + p.site + '" target="_blank" rel="noopener">Visit website</a>' + phone + '</div>' +
    '</div>';
}

function render(q) {
  q = (q || '').toLowerCase().trim();
  const grid = document.getElementById('grid');
  const list = PROSPECTS.filter(p =>
    (activeType === "All" || p.type === activeType) &&
    (!q || (p.name + ' ' + p.area + ' ' + p.fit + ' ' + p.type).toLowerCase().includes(q))
  );
  grid.innerHTML = list.length ? list.map(card).join('') : '<div class="empty">No prospects match that search.</div>';
  document.getElementById('summary').textContent =
    list.length + (list.length === 1 ? ' prospect' : ' prospects') +
    (activeType === "All" ? ' across ' + (TYPES.length - 1) + ' categories.' : ' in ' + activeType + '.');
}

document.getElementById('q').addEventListener('input', e => render(e.target.value));
renderFilters();
render('');
</script>
</body>
</html>
